<svg width="640" height="420" viewBox="0 0 640 420" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <style>
      .word { font-family: 'Quicksand', 'Trebuchet MS', sans-serif; font-weight: 700; }
      .tag { font-family: 'Nunito', 'Trebuchet MS', sans-serif; font-weight: 600; }
    </style>
  </defs>

  <!-- fondo transparente -->
  <rect width="640" height="420" fill="none"/>

  <!-- circulo contenedor suave -->
  <circle cx="320" cy="150" r="118" fill="#EFEAF9"/>

  <!-- ramas del nido (trazos ondulados entrelazados) -->
  <g fill="none" stroke="#8FA37D" stroke-width="6" stroke-linecap="round">
    <path d="M204 214 Q 234 196 262 210 Q 290 224 320 208 Q 350 192 378 208 Q 406 224 436 210"/>
    <path d="M212 228 Q 242 212 268 224 Q 294 236 320 222 Q 346 208 372 222 Q 398 236 428 224"/>
    <path d="M222 240 Q 250 226 274 236 Q 298 246 320 234 Q 342 222 366 234 Q 390 246 418 236"/>
  </g>

  <!-- base solida del nido -->
  <path d="M198 236 Q 320 284 442 236 L 442 246 Q 320 292 198 246 Z" fill="#7C9070"/>

  <!-- cola -->
  <path d="M228 152 Q 196 142 186 122 Q 212 130 236 146 Z" fill="#A3B18A"/>

  <!-- cuerpo del ave -->
  <ellipse cx="298" cy="150" rx="62" ry="52" fill="#B7A6DE"/>

  <!-- ala -->
  <path d="M270 122 Q 306 128 300 168 Q 274 166 258 144 Q 262 130 270 122 Z" fill="#8D7BC0"/>

  <!-- pecho del ave -->
  <ellipse cx="300" cy="176" rx="30" ry="24" fill="#FCEEA8"/>

  <!-- cabeza del ave -->
  <circle cx="352" cy="118" r="32" fill="#B7A6DE"/>

  <!-- pico -->
  <path d="M380 116 L 404 122 L 380 130 Z" fill="#F0C15E"/>

  <!-- ojo -->
  <circle cx="360" cy="110" r="4.5" fill="#4A3F63"/>

  <!-- nombre de marca -->
  <text x="320" y="330" text-anchor="middle" class="word" font-size="46" fill="#7C6BAE">Nido Seguro</text>

  <!-- slogan -->
  <text x="320" y="364" text-anchor="middle" class="tag" font-size="17" fill="#7C9070">Jugar para cuidar, preguntar para proteger</text>
</svg>
